<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine? 💝</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="hearts-background">
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
        <div class="heart"></div>
    </div>

    <div class="container" id="mainContainer">
        <h1 class="question">Will You Be My Valentine?</h1>
        
        <div class="buttons">
            <button class="btn yes-btn" id="yesBtn">Yes! 💕</button>
            <button class="btn no-btn" id="noBtn">No</button>
        </div>
    </div>

    <div class="celebration hidden" id="celebration">
        <h1 class="success-message">Yeyyy! 🎉💖</h1>
        <p class="success-text">Happy Valentine's Day LANGLINGGG! 💝</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>    <script src="app.js"></script>
</body>
</html>
